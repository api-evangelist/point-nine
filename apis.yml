aid: point-nine
name: Point Nine Capital
description: >-
  Point Nine Capital is a thesis-driven, early-stage venture capital firm founded in 2011 and
  headquartered in Berlin, Germany. It is one of Europe's best-known seed investors, specializing in
  B2B SaaS, B2B marketplaces, developer tools and infrastructure, fintech, digital health, and
  increasingly AI across digital, physical, and biological domains. Point Nine typically writes
  initial checks of roughly $1M-$10M (EUR 0.5M-5M) and aims to be the first institutional investor
  for "v0.9" founders graduating from friends-and-family capital. The firm runs a deliberately small,
  equal partnership in which each partner works closely with only 6-8 companies at a time to provide
  deep operational support. Since inception it has backed more than 160 startups across 30+ countries,
  including early bets on Algolia, Chainalysis, Clio, Contentful, Delivery Hero, Docplanner, Factorial,
  Front, Loom, Mambu, NexHealth, Revolut, Typeform, Zendesk, and Westwing, with 11+ companies reaching
  unicorn status.
